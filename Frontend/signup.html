<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성공일정</title>

    <!-- 메타 태그 설정 -->
    <meta name="author" content="Corporation">
    <meta name="keywords" content="성공일정, 아이젠하워 매트릭스, 업무 분배, 우선순위">
    <meta name="description" content="설명">

    <!-- Favicon -->
    <link rel="icon" href="img/anydo_104098.ico">

    <!-- Favicon for iphone -->
    <link rel="apple-touch-icon" href="./img/anydo_104098.ico">

    <!-- font awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- css -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/signup.css">

</head>

<body>
    <header>
        <div class="inner"> <!--컨텐츠의 너비-->
            <div class="header-container">
                <div class="title">
                    <a href="./index.html">성공일정</a>
                </div>
                <!-- title -->

                <div class="sign-container">
                    <div class="unsigned">
                        <div class="sign-in"><a href="./signin.html">로그인</a></div>
                        <div class="sign-up"><a href="./signup.html">회원가입</a></div>
                    </div>
                    <!-- unsigned -->

                    <div class="signed hidden">
                        <div class="dropdown">
                            <div class="dropdown-button">
                                안녕하세요. <span class="nickname">user</span>님.
                                <i class="fa-solid fa-caret-down"></i>
                            </div>
                            <!-- dropdown-button -->
                            <div class="dropdown-content">
                                <button id="sign-out">로그아웃</button>
                            </div>
                            <!-- dropdown-content -->
                        </div>
                    </div>
                    <!-- signed -->
                </div>
                <!-- header-container -->
            </div>
    </header>

    <!-- main contents -->
    <main>
        <div class="inner">
            <div class="signup-container">
                <h1>안녕하세요. <span class="blue">성공일정</span>입니다.</h1>
                <div class="signup-form">
                    <!-- Javascript로 Validation 확인 -->
                    <input type="text" placeholder="이메일" id="email">
                    <div class="email-message message">이메일 형식으로 입력해주세요.</div>

                    <input type="password" placeholder="비밀번호" id="password">
                    <div class="password-message message">영문, 숫자, 특수문자(!@$%^&*)조합 8~20자 입력</div>

                    <input type="password" placeholder="비밀번호 확인" id="password-confirm">
                    <div class="password-confirm-message message">비밀번호가 일치하지 않습니다.</div>

                    <input type="text" placeholder="닉네임" id="nickname">
                    <div class="nickname-message message">한글 or 영어 2-10로 설정해주세요.</div>

                    <input type="button" value="회원가입" id="signup">
                </div>
            </div>
        </div>
    </main>


    <footer>
        <div class="inner">
            <div class="footer-container">
                <div class="author">개발자: Random dev</div>
                <div class="author-email">이메일: dummy@dummy.com</div>

            </div>
            <!-- footer-container -->
        </div>
    </footer>



    <!-- JS -->
    <!-- axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
    
    <script src="./js/common.js"></script>
    <script src="./js/signup.js"></script>

</body>

</html>
